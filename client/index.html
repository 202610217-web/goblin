<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <!-- 확대/축소 막기 + 노치 영역까지 사용 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14161c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>집 부수기 3D</title>
  <!-- 디자인(Figma): IBM Plex Sans KR = 글자, IBM Plex Mono = 숫자 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="stage"></div>

  <!-- 입장 화면: 닉네임 → 새 방 만들기 / 코드로 들어가기 -->
  <div id="join" class="panel">
    <h1>집 부수기</h1>
    <p class="tagline">2 대 2 · 부수고, 지키고, 고치기</p>
    <label class="field"><span>닉네임</span><input id="nickInput" maxlength="12" autocomplete="off" placeholder="닉네임" /></label>
    <div class="joinSplit">
      <section>
        <h3 class="sub">새 방</h3>
        <button id="hostBtn">방 만들기</button>
        <p class="hint small">이 기기가 방이 돼요. 로비에 뜨는 코드를 친구에게 알려 주세요</p>
      </section>
      <section>
        <h3 class="sub">친구 방</h3>
        <div class="codeRow">
          <input id="roomInput" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="코드" aria-label="방 코드" />
          <button id="joinBtn">입장</button>
        </div>
      </section>
    </div>
    <p id="joinError" class="error"></p>
    <p id="a2hsHint" class="hint small hidden">홈 화면에 추가하면 전체 화면으로 할 수 있어요 (공유 → 홈 화면에 추가)</p>
  </div>

  <!-- 로비 -->
  <div id="lobby" class="panel hidden">
    <header class="lobbyHead">
      <div class="roomCode"><small>방 코드</small><b id="lobbyRoom"></b></div>
      <button id="leaveBtn" class="secondary">나가기</button>
    </header>
    <div class="lobbyGrid">
      <section>
        <div class="teams">
          <div class="team A"><h3>A팀</h3><div id="teamA"></div><button data-team="A" class="secondary">여기로 이동</button></div>
          <div class="team B"><h3>B팀</h3><div id="teamB"></div><button data-team="B" class="secondary">여기로 이동</button></div>
        </div>
        <div class="lobbyActions"><button id="readyBtn">준비</button><button id="startBtn" class="hidden">게임 시작</button></div>
        <p id="startHint" class="hint small"></p>
      </section>
      <section>
        <h3 class="sub">맵</h3>
        <div id="mapRow">
          <button data-map="CLASSIC" class="secondary"><b>기본 맵</b><small>팀마다 집 하나 · 작은 마을</small></button>
          <button data-map="NEON" class="secondary"><b>NEON DISTRICT</b><small>A · B 두 건물 · 넓은 도시</small></button>
        </div>
        <h3 class="sub">혼자 연습</h3>
        <div class="practice">
          <button id="addBotsBtn" class="secondary">더미로 채우기</button>
          <button id="removeBotsBtn" class="secondary hidden">더미 빼기</button>
          <button id="practiceBtn" class="secondary">바로 연습</button>
        </div>
        <h3 class="sub">설정</h3>
        <label class="check"><input type="checkbox" id="vibrateToggle" /> 맞으면 진동</label>
        <label class="check"><input type="checkbox" id="gfxToggle" /> 고화질 (그림자 · 빛 번짐)</label>
      </section>
    </div>
  </div>

  <!-- 직업 선택 (경기 시작 직후 5초) -->
  <div id="classSelect" class="panel hidden">
    <header class="classHead"><h2>직업 고르기</h2><b id="classLeft"></b></header>
    <div class="classGrid">
      <button data-cls="KNIGHT" class="secondary classCard"></button>
      <button data-cls="ARCHER" class="secondary classCard"></button>
      <button data-cls="JAVELIN" class="secondary classCard"></button>
      <button data-cls="GOBLIN" class="secondary classCard"></button>
    </div>
    <p id="classTeam" class="hint"></p>
  </div>
  <!-- 상단 HUD: 팀 킬 수 · 남은 시간 -->
  <div id="hud" class="hidden">
    <div class="scoreRow">
      <div class="teamScore A"><span id="scoreA">0</span></div>
      <div class="center">
        <div id="hudRound"></div>
        <div id="hudTimer"></div>
      </div>
      <div class="teamScore B"><span id="scoreB">0</span></div>
    </div>
  </div>
  <button id="scoreBtn" class="small iconBtn hidden" aria-label="점수판"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6H20M4 12H20M4 18H14"/></svg></button>
  <button id="fullscreenBtn" class="small iconBtn hidden" aria-label="전체 화면"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4H9M15 4H20V9M20 15V20H15M9 20H4V15"/></svg></button>
  <div id="netStatus"></div>
  <div id="teamPanelMine" class="teamPanel left hidden"></div>
  <canvas id="minimap" class="hidden"></canvas>
  <div id="debug" class="hidden"></div>

  <!-- 점수판 (탭하면 열고 닫힘) -->
  <div id="scoreboard" class="panel hidden">
    <h2>점수판</h2>
    <table>
      <thead><tr><th>팀</th><th>닉네임</th><th>킬</th><th>데스</th><th>상태</th></tr></thead>
      <tbody id="scoreboardBody"></tbody>
    </table>
    <button id="scoreClose" class="secondary">닫기</button>
  </div>

  <!-- 맞은 방향 · 알림 -->
  <div id="dmgLayer"></div>
  <div id="feed"></div>
  <!-- 조준점 -->
  <div id="crosshair" class="hidden"></div>

  <!-- 터치 조작 (왼손 = 이동, 오른손 = 행동) -->
  <div id="touch" class="hidden">
    <div id="stickBase"><div id="stickKnob"></div></div>
    <!-- 엄지 버튼: 타격(모서리) 둘레에 앉기·점프 -->
    <div id="buttons">
      <div id="crouchBtn" class="gameBtn sm" aria-label="앉기"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3V14"/><path d="M6.5 8.5L12 14L17.5 8.5"/><path d="M5 18H19"/><path d="M5 21H19"/></svg></div>
      <div id="jumpBtn" class="gameBtn sm" aria-label="점프"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18V5"/><path d="M6.5 10.5L12 5L17.5 10.5"/><path d="M5 21H19"/></svg></div>
      <div id="skillBtn" class="gameBtn sm hidden" aria-label="스킬"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14H12L11 22L20 10H12L13 2Z"/></svg><span id="skillLabel">스킬</span><div id="skillCd"></div></div>
      <div id="attackBtn" class="gameBtn" aria-label="타격"><svg class="ic" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5L3 6V3H6L17.5 14.5"/><path d="M13 19L19 13"/><path d="M16 16L20 20"/><path d="M19 21L21 19"/></svg><span id="attackLabel">타격</span><div id="attackCd"></div></div>
    </div>
  </div>

  <!-- 죽었을 때: 부활까지 남은 시간 -->
  <div id="downOverlay" class="hidden">
    <div id="downTitle"></div>
    <div id="downCount"></div>
    <div id="downHint"></div>
  </div>

  <!-- 경기 종료 -->
  <div id="matchEnd" class="panel hidden">
    <h1 id="matchTitle"></h1>
    <div id="matchScore"></div>
    <p id="matchSub" class="hint"></p>
    <p id="matchCloseNote" class="hint small hidden"></p>
    <div class="row"><button id="rematchBtn">다시 하기</button><button id="matchScoreBtn" class="secondary">점수판</button></div>
  </div>

  <div id="toast" class="hidden"></div>

  <!-- 세로 화면 안내 / 재접속 -->
  <div id="rotate" class="cover"><div>가로로 돌려주세요</div></div>
  <div id="reconnecting" class="cover dim hidden"><div>재접속 중...<br /><small id="reconnectInfo"></small><br /><button id="giveUpBtn" class="secondary">처음 화면으로</button></div></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
