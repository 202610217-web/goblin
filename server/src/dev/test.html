<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서버 테스트</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; background: #111; color: #eee; }
  input, button { font-size: 15px; padding: 6px 10px; margin: 3px 2px; }
  #room { text-transform: uppercase; width: 7em; }
  .row { margin: 6px 0; }
  .team { display: inline-block; vertical-align: top; width: 46%; min-width: 220px; padding: 8px; border: 1px solid #444; border-radius: 8px; margin: 4px; }
  .A { border-color: #e66; } .B { border-color: #69f; }
  .me { font-weight: bold; text-decoration: underline; }
  .rc { color: #fc6; } .rd { color: #6e6; }
  #hud { font-size: 20px; font-weight: bold; }
  canvas { background: #222; border: 1px solid #555; width: 100%; max-width: 960px; display: block; touch-action: none; }
  #log { white-space: pre-wrap; font: 12px monospace; background: #000; padding: 8px; height: 160px; overflow: auto; border-radius: 6px; }
</style>
</head>
<body>
<h3>집 부수기 서버 테스트 (2단계)</h3>
<div class="row">
  방 코드 <input id="room" maxlength="6" value="ABCD" autocapitalize="characters" />
  닉네임 <input id="nick" maxlength="12" placeholder="닉네임" />
  <button id="connect">입장</button>
  <button id="drop">연결 끊기</button>
  <button id="leave">나가기</button>
</div>
<div class="row">
  <button id="teamA">A팀</button><button id="teamB">B팀</button>
  <button id="rename">닉네임 변경</button>
  <button id="ready">준비</button><button id="unready">준비 취소</button>
  <button id="ping">ping</button>
</div>
<div class="row">디버그 단계 전환:
  <button data-phase="LOBBY">LOBBY</button><button data-phase="COUNTDOWN">COUNTDOWN</button>
  <button data-phase="ATTACK">ATTACK</button><button data-phase="REPAIR">REPAIR</button>
  <button data-phase="ROUND_END">ROUND_END</button>
</div>
<div class="row">상태: <span id="status">끊김</span> · 내 id: <span id="me">-</span> · 보낸 move: <span id="mcount">0</span></div>
<div id="hud">-</div>
<canvas id="cv" width="960" height="540"></canvas>
<div class="row"><small>이동: WASD / 방향키 (캔버스 밖을 클릭한 상태에서도 동작). 내 캐릭터는 흰 테두리.</small></div>
<div id="teams"></div>
<div id="log"></div>
<script>
  const $ = (id) => document.getElementById(id);
  let ws = null, myId = null, pingTimer = null, pingSent = 0;
  let map = null, room = null, clockOffset = 0; // clockOffset = 서버시각 - 내시각
  const players = new Map(); // id -> {x,y,dir,moveAt,team,nickname}
  const log = (s) => { $("log").textContent = `[${new Date().toLocaleTimeString()}] ${s}\n` + $("log").textContent.slice(0, 5000); };
  const roomCode = () => $("room").value.trim().toUpperCase();
  const tokenKey = () => "token:" + roomCode();
  const serverNow = () => Date.now() + clockOffset;
  $("room").addEventListener("input", (e) => { e.target.value = e.target.value.toUpperCase(); });

  function connect() {
    if (ws && ws.readyState <= 1) { log("이미 연결됨"); return; }
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(roomCode())}`);
    $("status").textContent = "연결 중...";
    ws.onopen = () => {
      $("status").textContent = "연결됨";
      send({ t: "join", nickname: $("nick").value, token: sessionStorage.getItem(tokenKey()) || undefined });
      clearInterval(pingTimer);
      pingTimer = setInterval(sendPing, 20000); // 20초마다 ping
    };
    ws.onmessage = (e) => {
      if (e.data === "pong") { log(`pong (${Date.now() - pingSent}ms)`); return; }
      const m = JSON.parse(e.data);
      if (m.t !== "move") log("← " + e.data.slice(0, 300));
      if (m.t === "welcome") {
        myId = m.playerId; map = m.map; clockOffset = m.serverTime - Date.now();
        $("me").textContent = myId + (m.resumed ? " (복귀)" : " (신규)");
        sessionStorage.setItem(tokenKey(), m.token);
        lastDir = -1; sendDir();
      } else if (m.t === "room_state") {
        room = m; clockOffset = m.serverTime - Date.now();
        players.clear();
        for (const p of m.players) players.set(p.id, { ...p });
        renderTeams();
      } else if (m.t === "move") {
        const p = players.get(m.id);
        if (p) Object.assign(p, { x: m.x, y: m.y, dir: m.dir, moveAt: m.at });
      }
    };
    ws.onclose = (e) => { $("status").textContent = `끊김 (code ${e.code})`; clearInterval(pingTimer); log(`연결 종료 code=${e.code} ${e.reason}`); };
    ws.onerror = () => log("소켓 오류 (Origin/방 코드 확인)");
  }
  function send(obj) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); if (obj.t !== "move") log("→ " + JSON.stringify(obj)); } }
  function sendPing() { if (ws && ws.readyState === 1) { pingSent = Date.now(); ws.send("ping"); } }

  // ---- 키보드 → 8방향 (서버 movement.ts 와 같은 번호) ----
  const keys = new Set();
  const DIRS = { "1,0": 1, "1,-1": 2, "0,-1": 3, "-1,-1": 4, "-1,0": 5, "-1,1": 6, "0,1": 7, "1,1": 8 };
  const VEC = [[0,0],[1,0],[Math.SQRT1_2,-Math.SQRT1_2],[0,-1],[-Math.SQRT1_2,-Math.SQRT1_2],[-1,0],[-Math.SQRT1_2,Math.SQRT1_2],[0,1],[Math.SQRT1_2,Math.SQRT1_2]];
  function currentDir() {
    const dx = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
    const dy = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
    return DIRS[`${dx},${dy}`] || 0;
  }
  // 방향이 바뀔 때만, 초당 최대 5회(200ms 간격), 마지막 방향은 반드시 전송
  let lastDir = 0, lastSendAt = 0, pendingTimer = null, mcount = 0;
  function sendDir() {
    const d = currentDir();
    if (d === lastDir) return;
    const wait = 200 - (Date.now() - lastSendAt);
    if (wait > 0) { if (!pendingTimer) pendingTimer = setTimeout(() => { pendingTimer = null; sendDir(); }, wait); return; }
    lastDir = d; lastSendAt = Date.now();
    send({ t: "move", dir: d }); $("mcount").textContent = ++mcount;
  }
  window.addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT") return; keys.add(e.key.toLowerCase()); sendDir(); if (e.key.startsWith("Arrow")) e.preventDefault(); });
  window.addEventListener("keyup", (e) => { keys.delete(e.key.toLowerCase()); sendDir(); });
  window.addEventListener("blur", () => { keys.clear(); sendDir(); });

  // ---- 그리기: 서버가 보낸 (x,y,dir,moveAt)로 현재 위치를 계산 ----
  function posOf(p, now) {
    const v = VEC[p.dir] || [0,0], dt = Math.max(0, now - p.moveAt) / 1000, r = map.playerRadius;
    return {
      x: Math.min(map.width - r, Math.max(r, p.x + v[0] * map.playerSpeed * dt)),
      y: Math.min(map.height - r, Math.max(r, p.y + v[1] * map.playerSpeed * dt)),
    };
  }
  const cv = $("cv"), g = cv.getContext("2d");
  function draw() {
    requestAnimationFrame(draw);
    g.clearRect(0, 0, cv.width, cv.height);
    if (!map) return;
    const k = cv.width / map.width; g.save(); g.scale(k, k);
    for (const t of ["A", "B"]) {
      const h = map.houses[t], s = map.houseSize;
      g.fillStyle = t === "A" ? "#733" : "#336"; g.fillRect(h.x - s / 2, h.y - s / 2, s, s);
      g.fillStyle = "#fff"; g.font = "40px sans-serif"; g.fillText(t + " 집", h.x - 40, h.y + 14);
    }
    const now = serverNow();
    for (const p of players.values()) {
      const { x, y } = posOf(p, now), r = map.playerRadius;
      g.fillStyle = p.team === "A" ? "#e66" : "#69f"; g.fillRect(x - r, y - r, r * 2, r * 2);
      if (p.id === myId) { g.strokeStyle = "#fff"; g.lineWidth = 6; g.strokeRect(x - r, y - r, r * 2, r * 2); }
      g.fillStyle = "#fff"; g.font = "28px sans-serif"; g.fillText(p.nickname + (p.conn === "RECONNECTING" ? " (재접속중)" : ""), x - r, y - r - 8);
    }
    g.restore();
    if (room) {
      const left = room.phaseEndsAt ? Math.max(0, Math.ceil((room.phaseEndsAt - now) / 1000)) : null;
      $("hud").textContent = `라운드 ${room.round} · ${room.phase} · 공격팀 ${room.attackingTeam}` + (left !== null ? ` · 남은 시간 ${left}초` : "");
    }
  }
  draw();

  function renderTeams() {
    const s = room, box = (team) => {
      const ps = s.players.filter((p) => p.team === team).map((p) => {
        const left = p.reconnectDeadline ? ` <span class="rc">재접속 대기 ${Math.max(0, Math.round((p.reconnectDeadline - s.serverTime) / 1000))}초</span>` : "";
        const rd = p.ready ? ' <span class="rd">✔준비</span>' : "";
        return `<div class="${p.id === myId ? "me" : ""}">${escapeHtml(p.nickname)} <small>(${p.id})</small>${rd}${left}</div>`;
      }).join("") || "<i>비어있음</i>";
      return `<div class="team ${team}"><b>${team}팀</b> (${s.players.filter((p) => p.team === team).length}/2)${ps}</div>`;
    };
    $("teams").innerHTML = `방 ${s.room} · ${s.players.length}/4명<br>` + box("A") + box("B");
  }
  function escapeHtml(t) { return t.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }

  $("connect").onclick = connect;
  $("drop").onclick = () => { if (ws) ws.close(); };
  $("leave").onclick = () => { send({ t: "leave" }); sessionStorage.removeItem(tokenKey()); myId = null; $("me").textContent = "-"; };
  $("teamA").onclick = () => send({ t: "set_team", team: "A" });
  $("teamB").onclick = () => send({ t: "set_team", team: "B" });
  $("rename").onclick = () => send({ t: "set_nickname", nickname: $("nick").value });
  $("ready").onclick = () => send({ t: "set_ready", ready: true });
  $("unready").onclick = () => send({ t: "set_ready", ready: false });
  $("ping").onclick = sendPing;
  document.querySelectorAll("[data-phase]").forEach((b) => b.onclick = () => send({ t: "debug_phase", phase: b.dataset.phase }));
</script>
</body>
</html>
