<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서버 테스트</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  input, button { font-size: 16px; padding: 8px 12px; margin: 4px 2px; }
  #room { text-transform: uppercase; width: 8em; }
  .row { margin: 8px 0; }
  .team { display: inline-block; vertical-align: top; width: 46%; min-width: 220px; padding: 8px; border: 1px solid #444; border-radius: 8px; margin: 4px; }
  .A { border-color: #e66; } .B { border-color: #69f; }
  .me { font-weight: bold; text-decoration: underline; }
  .rc { color: #fc6; }
  #log { white-space: pre-wrap; font: 12px monospace; background: #000; padding: 8px; height: 240px; overflow: auto; border-radius: 6px; }
</style>
</head>
<body>
<h2>집 부수기 서버 테스트 (1단계)</h2>
<div class="row">
  방 코드 <input id="room" maxlength="6" value="ABCD" autocapitalize="characters" />
  닉네임 <input id="nick" maxlength="12" placeholder="닉네임" />
</div>
<div class="row">
  <button id="connect">입장</button>
  <button id="drop">연결 끊기(재접속 테스트)</button>
  <button id="leave">나가기</button>
</div>
<div class="row">
  <button id="teamA">A팀으로</button>
  <button id="teamB">B팀으로</button>
  <button id="rename">닉네임 변경</button>
  <button id="ping">ping</button>
</div>
<div class="row">상태: <span id="status">끊김</span> · 내 id: <span id="me">-</span></div>
<div id="teams"></div>
<h3>로그</h3>
<div id="log"></div>
<script>
  const $ = (id) => document.getElementById(id);
  let ws = null, myId = null, pingTimer = null, pingSent = 0;
  const log = (s) => { $("log").textContent = `[${new Date().toLocaleTimeString()}] ${s}\n` + $("log").textContent; };
  const roomCode = () => $("room").value.trim().toUpperCase();
  const tokenKey = () => "token:" + roomCode();
  $("room").addEventListener("input", (e) => { e.target.value = e.target.value.toUpperCase(); });

  function connect() {
    if (ws && ws.readyState <= 1) { log("이미 연결됨"); return; }
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(roomCode())}`);
    $("status").textContent = "연결 중...";
    ws.onopen = () => {
      $("status").textContent = "연결됨";
      const token = sessionStorage.getItem(tokenKey()) || undefined;
      send({ t: "join", nickname: $("nick").value, token });
      clearInterval(pingTimer);
      pingTimer = setInterval(() => sendPing(), 20000); // 20초마다 ping
    };
    ws.onmessage = (e) => {
      if (e.data === "pong") { log(`pong (${Date.now() - pingSent}ms)`); return; }
      const m = JSON.parse(e.data);
      log("← " + e.data);
      if (m.t === "welcome") {
        myId = m.playerId; $("me").textContent = myId + (m.resumed ? " (복귀)" : " (신규)");
        sessionStorage.setItem(tokenKey(), m.token);
      } else if (m.t === "room_state") render(m);
    };
    ws.onclose = (e) => { $("status").textContent = `끊김 (code ${e.code})`; clearInterval(pingTimer); log(`연결 종료 code=${e.code} ${e.reason}`); };
    ws.onerror = () => log("소켓 오류 (Origin/방 코드 확인)");
  }
  function send(obj) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); log("→ " + JSON.stringify(obj)); } }
  function sendPing() { if (ws && ws.readyState === 1) { pingSent = Date.now(); ws.send("ping"); } }
  function render(s) {
    const box = (team) => {
      const ps = s.players.filter((p) => p.team === team).map((p) => {
        const left = p.reconnectDeadline ? ` <span class="rc">재접속 대기 ${Math.max(0, Math.round((p.reconnectDeadline - s.serverTime) / 1000))}초</span>` : "";
        return `<div class="${p.id === myId ? "me" : ""}">${escapeHtml(p.nickname)} <small>(${p.id})</small>${left}</div>`;
      }).join("") || "<i>비어있음</i>";
      return `<div class="team ${team}"><b>${team}팀</b> (${s.players.filter((p) => p.team === team).length}/2)${ps}</div>`;
    };
    $("teams").innerHTML = `방 ${s.room} · 단계 ${s.phase} · ${s.players.length}/4명<br>` + box("A") + box("B");
  }
  function escapeHtml(t) { return t.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }

  $("connect").onclick = connect;
  $("drop").onclick = () => { if (ws) ws.close(); };
  $("leave").onclick = () => { send({ t: "leave" }); sessionStorage.removeItem(tokenKey()); myId = null; $("me").textContent = "-"; };
  $("teamA").onclick = () => send({ t: "set_team", team: "A" });
  $("teamB").onclick = () => send({ t: "set_team", team: "B" });
  $("rename").onclick = () => send({ t: "set_nickname", nickname: $("nick").value });
  $("ping").onclick = sendPing;
</script>
</body>
</html>
